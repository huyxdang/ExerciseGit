name: Refresh exercise SVG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

env:
  EXERCISE_SVG_PATH: public/exercise.svg
  PROFILE_README_REPOSITORY: ${{ vars.PROFILE_README_REPOSITORY || format('{0}/{0}', github.repository_owner) }}
  SVG_THEME: github-strava

concurrency:
  group: refresh-exercise-svg
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate SVG
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_REFRESH_TOKEN_FILE: .strava-refresh-token
          OUTPUT_SVG: ${{ env.EXERCISE_SVG_PATH }}
        run: npm run generate:svg

      - name: Save rotated Strava refresh token
        env:
          SECRET_UPDATER_TOKEN: ${{ secrets.SECRET_UPDATER_TOKEN }}
        run: |
          if [ ! -s .strava-refresh-token ]; then
            exit 0
          fi

          if [ -z "$SECRET_UPDATER_TOKEN" ]; then
            echo "::warning::Strava returned a new refresh token, but SECRET_UPDATER_TOKEN is not configured. Update STRAVA_REFRESH_TOKEN manually before the next run."
            rm .strava-refresh-token
            exit 0
          fi

          if ! GH_TOKEN="$SECRET_UPDATER_TOKEN" gh secret set STRAVA_REFRESH_TOKEN < .strava-refresh-token; then
            echo "::warning::Strava returned a new refresh token, but SECRET_UPDATER_TOKEN could not update STRAVA_REFRESH_TOKEN. Update STRAVA_REFRESH_TOKEN manually before the next run."
          fi
          rm .strava-refresh-token

      - name: Commit SVG if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh exercise SVG"
          file_pattern: ${{ env.EXERCISE_SVG_PATH }}

      - name: Check profile README token
        id: profile-readme-token
        env:
          PROFILE_README_TOKEN: ${{ secrets.PROFILE_README_TOKEN || secrets.SECRET_UPDATER_TOKEN }}
        run: |
          if [ -z "$PROFILE_README_TOKEN" ]; then
            echo "::warning::PROFILE_README_TOKEN is not configured, so the profile README SVG cache key will not be refreshed."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Check out profile README repository
        id: profile-readme-checkout
        if: steps.profile-readme-token.outputs.available == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PROFILE_README_REPOSITORY }}
          token: ${{ secrets.PROFILE_README_TOKEN || secrets.SECRET_UPDATER_TOKEN }}
          path: profile-readme

      - name: Warn if profile README checkout failed
        if: steps.profile-readme-token.outputs.available == 'true' && steps.profile-readme-checkout.outcome != 'success'
        run: echo "::warning::Could not check out $PROFILE_README_REPOSITORY. Make sure PROFILE_README_TOKEN can read and write that repository."

      - name: Bump profile README SVG cache
        if: steps.profile-readme-token.outputs.available == 'true' && steps.profile-readme-checkout.outcome == 'success'
        working-directory: profile-readme
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const readmePath = "README.md";
          const branch = process.env.GITHUB_REF_NAME || "main";
          const sourceRepo = process.env.GITHUB_REPOSITORY;
          const svgPath = process.env.EXERCISE_SVG_PATH;
          const rawUrl = `https://raw.githubusercontent.com/${sourceRepo}/${branch}/${svgPath}`;
          const cacheKey = new Date().toISOString().replace(/\D/g, "").slice(0, 14);
          const readme = fs.readFileSync(readmePath, "utf8");
          const escapedRawUrl = rawUrl.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
          const pattern = new RegExp(`${escapedRawUrl}(?:\\?v=[^"'\\s<>)]*)?`, "g");
          const updated = readme.replace(pattern, `${rawUrl}?v=${cacheKey}`);

          if (updated === readme) {
            console.log("No ExerciseGit SVG URL found in README.md.");
            process.exit(0);
          }

          fs.writeFileSync(readmePath, updated);
          console.log(`Updated ExerciseGit SVG cache key to ${cacheKey}.`);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Refresh ExerciseGit SVG cache"
          if ! git push; then
            echo "::warning::Could not push the profile README cache refresh. Make sure PROFILE_README_TOKEN has contents write access to $PROFILE_README_REPOSITORY."
            exit 0
          fi
