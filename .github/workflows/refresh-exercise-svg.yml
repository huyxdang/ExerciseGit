name: Refresh exercise SVG

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: refresh-exercise-svg
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate SVG
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          STRAVA_REFRESH_TOKEN_FILE: .strava-refresh-token
          SVG_THEME: github-strava
          OUTPUT_SVG: public/exercise.svg
        run: npm run generate:svg

      - name: Save rotated Strava refresh token
        env:
          SECRET_UPDATER_TOKEN: ${{ secrets.SECRET_UPDATER_TOKEN }}
        run: |
          if [ ! -s .strava-refresh-token ]; then
            exit 0
          fi

          if [ -z "$SECRET_UPDATER_TOKEN" ]; then
            echo "::warning::Strava returned a new refresh token, but SECRET_UPDATER_TOKEN is not configured. Update STRAVA_REFRESH_TOKEN manually before the next run."
            rm .strava-refresh-token
            exit 0
          fi

          GH_TOKEN="$SECRET_UPDATER_TOKEN" gh secret set STRAVA_REFRESH_TOKEN < .strava-refresh-token
          rm .strava-refresh-token

      - name: Commit SVG if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Refresh exercise SVG"
          file_pattern: public/exercise.svg

      - name: Check profile README token
        id: profile-readme-token
        env:
          PROFILE_README_TOKEN: ${{ secrets.SECRET_UPDATER_TOKEN }}
        run: |
          if [ -z "$PROFILE_README_TOKEN" ]; then
            echo "::warning::SECRET_UPDATER_TOKEN is not configured, so the profile README SVG cache key will not be refreshed."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Check out profile README repository
        id: profile-readme-checkout
        if: steps.profile-readme-token.outputs.available == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: huyxdang/huyxdang
          token: ${{ secrets.SECRET_UPDATER_TOKEN }}
          path: profile-readme

      - name: Warn if profile README checkout failed
        if: steps.profile-readme-token.outputs.available == 'true' && steps.profile-readme-checkout.outcome != 'success'
        run: echo "::warning::Could not check out huyxdang/huyxdang. Make sure SECRET_UPDATER_TOKEN can read and write that repository."

      - name: Bump profile README SVG cache
        if: steps.profile-readme-token.outputs.available == 'true' && steps.profile-readme-checkout.outcome == 'success'
        working-directory: profile-readme
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const readmePath = "README.md";
          const rawUrl = "https://raw.githubusercontent.com/huyxdang/ExerciseGit/main/public/exercise.svg";
          const cacheKey = new Date().toISOString().replace(/\D/g, "").slice(0, 14);
          const readme = fs.readFileSync(readmePath, "utf8");
          const pattern = /https:\/\/raw\.githubusercontent\.com\/huyxdang\/ExerciseGit\/main\/public\/exercise\.svg(?:\?v=[^"'\s<>)]*)?/g;
          const updated = readme.replace(pattern, `${rawUrl}?v=${cacheKey}`);

          if (updated === readme) {
            console.log("No ExerciseGit SVG URL found in README.md.");
            process.exit(0);
          }

          fs.writeFileSync(readmePath, updated);
          console.log(`Updated ExerciseGit SVG cache key to ${cacheKey}.`);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Refresh ExerciseGit SVG cache"
          if ! git push; then
            echo "::warning::Could not push the profile README cache refresh. Make sure SECRET_UPDATER_TOKEN has contents write access to huyxdang/huyxdang."
            exit 0
          fi
